<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pools de Pádel</title>
<meta name="description" content="Pools de pádel: elige la tuya y apúntate.">
<meta name="theme-color" content="#13233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Móvil primero: una columna de 16px de margen que crece hasta 600px en tablet/ordenador.
   Cabecera oscura, tarjetas claras, barra de acción fija abajo respetando la zona segura del iPhone. */
:root{
  --bg:#F0F2EF; --card:#FFFFFF; --mint:#E8EDE8; --ink:#1A1A18; --muted:#6F7069; --line:#DEE1DA;
  --accent:#11427D; --accent-ink:#FFFFFF; --accent-soft:#E3EAF3; --head:#13233A; --head-ink:#F0F2EF; --head-muted:rgba(240,242,239,.72);
  --ok:#3F7A52; --ok-soft:#E2EFE5; --warn:#B0521F; --warn-soft:#F8E9DF;
  --fd:"Playfair Display",Georgia,"Times New Roman",serif; --fb:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111412; --card:#1A1E1B; --mint:#222823; --ink:#ECEFEA; --muted:#9DA39A; --line:#2C332D;
  --accent:#6FA3E6; --accent-ink:#0B1A2E; --accent-soft:#1A2738; --head:#0B1524; --head-ink:#ECEFEA;
  --ok:#7CC492; --ok-soft:#1B2D21; --warn:#F0A070; --warn-soft:#33231A; color-scheme:dark } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
.wrap{width:100%;max-width:600px;margin:0 auto;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar))}
a{color:var(--accent)}

/* cabecera */
header.top{background:var(--head);color:var(--head-ink);padding-top:calc(16px + var(--sat));padding-bottom:22px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--head-muted);text-decoration:none;font-size:14px;font-weight:500;min-height:44px;margin:-8px 0 2px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted);font-weight:600}
h1{font:600 clamp(26px,7.5vw,34px)/1.12 var(--fd);margin:6px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.meta{color:var(--head-muted);font-size:15px}
.notas{color:var(--head-ink);font-size:14.5px;font-weight:500;white-space:pre-line;margin-top:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08);overflow-wrap:anywhere}
.poolcard .nt{font-size:13.5px;color:var(--ink);margin-top:4px;white-space:pre-line;overflow-wrap:anywhere}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.13);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.ok{background:var(--ok);color:#fff} .pill.warn{background:var(--warn);color:#fff} .pill.done{background:#7FB2F0;color:#0B1A2E}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.15);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#7FB2F0;border-radius:99px;transition:width .4s}

main{padding-top:18px;padding-bottom:calc(110px + var(--sab));display:grid;gap:24px}
main.noBar{padding-bottom:calc(32px + var(--sab))}
h2{font:600 21px/1.2 var(--fd);margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2 small{font:500 13px var(--fb);color:var(--muted)}

/* listado de pools */
.pools{display:grid;gap:10px}
.poolcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;position:relative}
.poolcard:active{transform:scale(.99)}
.poolcard .t{font:600 18px/1.25 var(--fd);padding-right:24px;overflow-wrap:anywhere}
.poolcard .m{color:var(--muted);font-size:14px;margin-top:2px}
.poolcard .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.poolcard .chev{position:absolute;right:14px;top:16px;color:var(--muted);font-size:20px}
.tag{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;background:var(--mint);font-variant-numeric:tabular-nums}
.tag.open{background:var(--ok-soft);color:var(--ok)} .tag.closed{background:var(--warn-soft);color:var(--warn)} .tag.drawn{background:var(--accent-soft);color:var(--accent)}
.mini{height:4px;border-radius:99px;background:var(--mint);margin-top:10px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}

/* lista de apuntados */
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:48px}
.list li:first-child{border-top:0}
.n{min-width:1.9em;text-align:right;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.free .nm{color:var(--muted);font-weight:400;font-style:italic}
.me{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;flex:none}
.del{border:0;background:transparent;color:var(--warn);font:600 14px var(--fb);padding:10px 4px;min-height:44px;cursor:pointer;flex:none}
.empty{color:var(--muted);font-size:15px;padding:14px}
.moves{list-style:none;margin:0;padding:0;font-size:14.5px;display:grid;gap:8px}
.moves li{display:flex;gap:8px;align-items:baseline}
.moves .tm{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:8px}
.moves .alta b{color:var(--ok)} .moves .baja b{color:var(--warn)}
.note{border-radius:14px;padding:12px 14px;font-size:15px;background:var(--mint)}
.note.warn{background:var(--warn-soft);color:var(--warn)}

/* resultado del sorteo */
.draw{display:grid;gap:10px}
.court{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.court b{display:block;font:600 18px var(--fd);margin-bottom:6px}
.court .pr{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line)}
.court .pr:first-of-type{border-top:0}
.court .pr span:first-child{color:var(--muted);font-size:13px;font-weight:600;flex:none;min-width:4.8em}
.court .pr span:last-child{font-weight:500;overflow-wrap:anywhere;min-width:0}
@media (min-width:540px){ .draw{grid-template-columns:1fr 1fr} }

footer{color:var(--muted);font-size:13px;text-align:center}

/* barra fija inferior */
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-top:10px;padding-bottom:calc(10px + var(--sab))}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 14px;min-height:52px;font:600 16px var(--fb);cursor:pointer;background:var(--mint);color:var(--ink);text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.poolcard:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* hojas inferiores */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px max(16px,var(--sar)) calc(20px + var(--sab)) max(16px,var(--sal));max-height:90dvh;overflow:auto;overscroll-behavior:contain}
@media (min-width:640px){ .sheet{align-items:center} .panel{border-radius:22px;padding-bottom:20px} }
.panel h3{font:600 23px var(--fd);margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:none;font-size:28px;line-height:1;color:var(--muted);cursor:pointer;min-width:44px;min-height:44px}
.panel p{margin:0 0 14px;color:var(--muted);font-size:15px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field span{font-size:14px;font-weight:600}
/* 16px como mínimo para que el iPhone no haga zoom al escribir */
input[type=text]{font:16px var(--fb);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;-webkit-appearance:none;appearance:none}
.err{color:var(--warn);font-size:14px;margin:-4px 0 12px;min-height:1px}
.stack{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="back" id="back" href="./" hidden>‹ Todas las pools</a>
  <div class="eyebrow" id="eyebrow">Pádel</div>
  <h1 id="title">Cargando…</h1>
  <div class="meta" id="meta"></div>
  <div class="notas" id="notas" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar" hidden><i id="barFill" style="width:0"></i></div>
</div></header>

<main class="wrap noBar" id="main">
  <div class="loading">Cargando…</div>
</main>

<div class="actions" id="actions" hidden><div class="wrap">
  <button class="btn primary" id="bJoin" type="button">Apuntarme</button>
</div></div>

<!-- Apuntarme -->
<div class="sheet" id="sJoin" hidden><div class="panel" role="dialog" aria-labelledby="sJoinT">
  <h3 id="sJoinT">Apuntarme <button class="x" data-close aria-label="Cerrar">×</button></h3>
  <p id="joinHint">Escribe tu nombre como te conocen en el grupo.</p>
  <label class="field"><span>Nombre</span><input type="text" id="fName" maxlength="40" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="words" enterkeyhint="send" placeholder="Ej.: Juan García"></label>
  <div class="err" id="fErr" role="alert"></div>
  <button class="btn primary" id="fSend" type="button">Apuntarme</button>
</div></div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ===== CONFIGURACIÓN ===== */
const SUPABASE_URL = "https://yabgsoghquknuxwrfjaw.supabase.co";
const SUPABASE_KEY = "sb_publishable_u2rkqQObLvgSkSbe47lEKQ_AktMfGsW";   // clave pública (publishable): no es secreta
/* ========================= */

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("pool." + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("pool." + k, JSON.stringify(v)); } catch(e){} }
};
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") el.className = v; else if (k.startsWith("on")) el[k] = v; else el.setAttribute(k, v); }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); }
const hora = iso => { const d = new Date(iso), hoy = new Date();
  const hm = d.toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"});
  return d.toDateString() === hoy.toDateString() ? hm : d.toLocaleDateString("es-ES", {weekday:"short", day:"numeric"}) + " " + hm; };
const fecha = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const hoyIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const ESTADO = {abierta: ["Inscripción abierta", "open"], cerrada: ["Inscripción cerrada", "closed"], sorteada: ["Sorteo hecho", "drawn"]};

/* ---------- datos (Supabase) o modo ejemplo (?demo) ---------- */
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
const CODIGO = (params.get("pool") || "").toUpperCase();

function supabaseBackend(){
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: false}});
  const ok = r => { if (r.error) throw r.error; return r.data; };
  return {
    async pools(){
      const pools = ok(await sb.from("pools").select("*").order("fecha", {ascending:false}).order("created_at", {ascending:false}).limit(30));
      const ids = pools.map(p => p.id), cuenta = {};
      if (ids.length) ok(await sb.from("inscripciones").select("pool_id").in("pool_id", ids)).forEach(r => cuenta[r.pool_id] = (cuenta[r.pool_id] || 0) + 1);
      return pools.map(p => ({...p, apuntados: cuenta[p.id] || 0}));
    },
    async pool(codigo){ return ok(await sb.from("pools").select("*").eq("codigo", codigo).limit(1))[0] || null; },
    async datos(pool){
      const [a, b, c] = await Promise.all([
        sb.from("inscripciones").select("id,nombre,created_at").eq("pool_id", pool.id).order("created_at"),
        sb.from("movimientos").select("tipo,nombre,created_at").eq("pool_id", pool.id).order("created_at", {ascending:false}).limit(30),
        sb.from("resultados").select("pista,pareja,nombre").eq("pool_id", pool.id).order("pista").order("pareja"),
      ]);
      return {inscritos: ok(a), movimientos: ok(b), resultados: ok(c)};
    },
    escuchar(pool, cb){
      sb.channel("pool-" + pool.id)
        .on("postgres_changes", {event:"*", schema:"public", table:"inscripciones", filter:"pool_id=eq." + pool.id}, cb)
        .on("postgres_changes", {event:"*", schema:"public", table:"pools"}, cb)   // incluye el borrado de la pool
        .on("postgres_changes", {event:"*", schema:"public", table:"resultados", filter:"pool_id=eq." + pool.id}, cb)
        .subscribe();
    },
    escucharListado(cb){
      sb.channel("listado")
        .on("postgres_changes", {event:"*", schema:"public", table:"pools"}, cb)
        .on("postgres_changes", {event:"*", schema:"public", table:"inscripciones"}, cb)
        .subscribe();
    },
    async apuntarse(pool, nombre){ return ok(await sb.rpc("apuntarse", {p_pool: pool.id, p_nombre: nombre})); },
    async borrarse(id, token){ return ok(await sb.rpc("borrarse", {p_id: id, p_token: token})); },
  };
}

function demoBackend(){
  // Datos de EJEMPLO para ver el diseño: inventados y sin guardar
  const N = ["Vicente","Juan","Lucía","Carlos","Marta","Miguel","Antonio","Elena","Paula","Raúl","Sara","Diego","Clara","Irene","Pedro","Ana","Luis"];
  const t0 = Date.now() - 36e5 * 20;
  const mk = (codigo, titulo, f, estado, n, max) => ({id: codigo, codigo, titulo, horario: "21:30-23:00", importe: "6€ PERSONA", fecha: f, max_jugadores: max, max_reservas: 10, estado,
    ins: N.slice(0, n).map((x, i) => ({id: codigo + i, nombre: x, created_at: new Date(t0 + i * 36e5).toISOString()}))});
  const P = [Object.assign(mk("DEMO2", "POOL JUEVES 15 OCT", "2026-10-15", "abierta", 6, 8), {notas: "PÁDEL INDOOR · Traed bolas nuevas"}), mk("DEMO", "POOL MARTES 13 OCT", "2026-10-13", "abierta", 17, 20), mk("DEMO0", "POOL MARTES 6 OCT", "2026-10-06", "sorteada", 8, 8)];
  const res = [];
  P[2].ins.forEach((x, i) => res.push({pista: Math.floor(i / 4) + 1, pareja: Math.floor(i / 2) % 2 + 1, nombre: x.nombre}));
  let cb = null;
  return {
    async pools(){ return P.map(p => ({...p, apuntados: p.ins.length})); },
    async pool(c){ return P.find(p => p.codigo === c) || null; },
    async datos(p){ return {inscritos: p.ins.slice(), movimientos: p.ins.map(i => ({tipo:"alta", nombre:i.nombre, created_at:i.created_at})).reverse(), resultados: p.estado === "sorteada" ? res : []}; },
    escuchar(p, f){ cb = f; },
    escucharListado(){},
    async apuntarse(p, nombre){
      if (p.ins.some(i => i.nombre.toLowerCase() === nombre.toLowerCase())) throw {message: "NOMBRE_REPETIDO"};
      const r = {id: "n" + Date.now(), nombre, created_at: new Date().toISOString()}; p.ins.push(r); setTimeout(cb, 50); return {id: r.id, token: "demo"};
    },
    async borrarse(id){ P.forEach(p => p.ins = p.ins.filter(i => i.id !== id)); setTimeout(cb, 50); return true; },
  };
}

const ERRORES = {
  POOL_CERRADA: "La inscripción está cerrada.",
  POOL_COMPLETA: "La lista y las reservas están completas.",
  NOMBRE_REPETIDO: "Ya hay alguien apuntado con ese nombre. Añade tu apellido o una inicial.",
  DATOS_NO_VALIDOS: "Escribe tu nombre.",
  POOL_NO_EXISTE: "Esta pool ya no existe.",
};
const errText = e => { const m = String(e && e.message || e); const k = Object.keys(ERRORES).find(k => m.includes(k)); return k ? ERRORES[k] : "No se ha podido conectar. Comprueba la conexión y vuelve a intentarlo."; };
const link = codigo => "?" + (DEMO ? "demo&" : "") + "pool=" + codigo;

/* ================= LISTADO DE POOLS ================= */
async function vistaListado(){
  $("back").hidden = true;
  $("eyebrow").textContent = DEMO ? "Vista de ejemplo · datos inventados" : "Pádel";
  $("title").textContent = "Pools de pádel";
  $("meta").textContent = "Elige tu pool y apúntate.";
  const pools = await api.pools(), hoy = hoyIso();
  const prox = pools.filter(p => p.fecha >= hoy).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const ant = pools.filter(p => p.fecha < hoy).slice(0, 8);
  const card = p => {
    const est = ESTADO[p.estado] || ["", ""], lleno = Math.min(p.apuntados, p.max_jugadores), res = Math.max(0, p.apuntados - p.max_jugadores);
    return h("a", {class: "poolcard", href: link(p.codigo)},
      h("div", {class: "t"}, p.titulo), h("span", {class: "chev", "aria-hidden": "true"}, "›"),
      h("div", {class: "m"}, [fecha(p.fecha).toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "long"}), p.horario, p.importe && p.importe.toLowerCase()].filter(Boolean).join(" · ")),
      p.notas ? h("div", {class: "nt"}, p.notas) : null,
      h("div", {class: "row"}, h("span", {class: "tag " + est[1]}, est[0]), h("span", {class: "tag"}, `${lleno} / ${p.max_jugadores} jugadores`),
        lleno >= p.max_jugadores && p.estado === "abierta" ? h("span", {class: "tag open"}, "🟢 Completa") : null, res ? h("span", {class: "tag"}, `${res} en reservas`) : null),
      h("div", {class: "mini"}, h("i", {style: `width:${lleno / p.max_jugadores * 100}%`})));
  };
  const main = $("main"); main.replaceChildren();
  main.append(h("section", {}, h("h2", {}, "Próximas"),
    prox.length ? h("div", {class: "pools"}, prox.map(card)) : h("div", {class: "note"}, "Ahora mismo no hay ninguna pool. En cuanto el organizador cree la siguiente, aparecerá aquí.")));
  if (ant.length) main.append(h("section", {}, h("h2", {}, "Anteriores", h("small", {}, "resultados de los sorteos")), h("div", {class: "pools"}, ant.map(card))));
  main.className = "wrap noBar";
}

/* ================= DETALLE DE UNA POOL ================= */
let POOL = null, D = {inscritos: [], movimientos: [], resultados: []};
const mias = () => store.get("mias", {});

function vistaBorrada(){
  $("actions").hidden = true; $("bar").hidden = true; $("stats").replaceChildren(); $("notas").hidden = true;
  $("eyebrow").textContent = "Pádel"; $("title").textContent = "Esta pool ya no existe"; $("meta").textContent = "";
  document.title = "Pools de Pádel";
  $("main").className = "wrap noBar";
  $("main").replaceChildren(h("div", {class: "note"}, "El organizador la ha borrado. ", h("a", {href: DEMO ? "./?demo" : "./"}, "Ver las pools disponibles")));
}
function vistaPool(){
  const p = POOL, max = p.max_jugadores, lista = D.inscritos.slice(0, max), reservas = D.inscritos.slice(max);
  document.title = p.titulo;
  $("back").hidden = false; $("back").href = DEMO ? "./?demo" : "./";
  $("eyebrow").textContent = DEMO ? "Vista de ejemplo · datos inventados" : fecha(p.fecha).toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "long"});
  $("title").textContent = p.titulo;
  $("meta").textContent = [p.horario, p.importe && p.importe.toLowerCase()].filter(Boolean).join(" · ");
  $("notas").hidden = !p.notas; $("notas").textContent = p.notas || "";
  const est = p.estado === "sorteada" ? ["Sorteo hecho", "done"] : p.estado === "cerrada" ? ["Inscripción cerrada", "warn"] : lista.length >= max ? ["🟢 Pool completa", "ok"] : ["Inscripción abierta", ""];
  $("stats").replaceChildren(...[h("span", {class: "pill"}, `${lista.length} / ${max} jugadores`),
    reservas.length ? h("span", {class: "pill"}, `${reservas.length} en reservas`) : null, h("span", {class: "pill " + est[1]}, est[0])].filter(Boolean));
  $("bar").hidden = false; $("barFill").style.width = Math.min(100, lista.length / max * 100) + "%";

  const mine = mias(), puedeBorrar = p.estado !== "sorteada";
  const row = (i, n) => h("li", {}, h("span", {class: "n"}, n + "."), h("span", {class: "nm"}, i.nombre),
    mine[i.id] ? h("span", {class: "me"}, "TÚ") : null,
    mine[i.id] && puedeBorrar ? h("button", {class: "del", type: "button", onclick: () => quitar(i)}, "Borrarme") : null);

  const main = $("main"); main.replaceChildren();
  // resultado del sorteo, lo primero cuando ya está hecho
  if (D.resultados.length) {
    const pistas = {};
    D.resultados.forEach(r => ((pistas[r.pista] ||= {})[r.pareja] ||= []).push(r.nombre));
    main.append(h("section", {}, h("h2", {}, "🎲 Sorteo", h("small", {}, "pistas y parejas")),
      h("div", {class: "draw"}, Object.keys(pistas).sort((a, b) => a - b).map(n => h("div", {class: "court"}, h("b", {}, `Pista ${n}`),
        Object.keys(pistas[n]).sort((a, b) => a - b).map(k => h("div", {class: "pr"}, h("span", {}, `Pareja ${k}`), h("span", {}, pistas[n][k].join(" + "))))))),
      // apuntados que no han entrado (solo se sortean pistas completas, por orden de inscripción)
      (() => { const enPista = new Set(D.resultados.map(r => r.nombre.toLowerCase()));
        const sin = D.inscritos.filter(i => !enPista.has(i.nombre.toLowerCase())).map(i => i.nombre);
        return sin.length ? h("div", {class: "note", style: "margin-top:10px"}, `⏳ Sin pista: ${sin.join(", ")}`) : null; })()));
  } else if (p.estado === "sorteada" || p.estado === "cerrada") {
    main.append(h("div", {class: p.estado === "cerrada" ? "note warn" : "note"}, p.estado === "cerrada"
      ? "La inscripción está cerrada. El sorteo aparecerá aquí en cuanto el organizador lo haga." : "Esperando a que el organizador publique el sorteo."));
  }

  const free = [];
  for (let k = lista.length; k < max; k++) free.push(h("li", {class: "free"}, h("span", {class: "n"}, (k + 1) + "."), h("span", {class: "nm"}, "Libre")));
  main.append(h("section", {}, h("h2", {}, "La lista", h("small", {}, "por orden de inscripción")), h("ol", {class: "list"}, lista.map((i, k) => row(i, k + 1)), free)));
  main.append(h("section", {}, h("h2", {}, "Reservas", h("small", {}, "entran por orden si alguien se borra")),
    reservas.length ? h("ol", {class: "list"}, reservas.map((i, k) => row(i, "R" + (k + 1)))) : h("div", {class: "list"}, h("div", {class: "empty"}, "Nadie en reservas."))));
  if (D.movimientos.length) main.append(h("section", {}, h("h2", {}, "Movimientos"),
    h("ul", {class: "moves"}, D.movimientos.slice(0, 15).map(m => h("li", {class: m.tipo},
      h("b", {}, m.tipo === "alta" ? "＋" : "－"), h("span", {}, `${m.nombre} ${m.tipo === "alta" ? "se apunta" : "se borra"}`), h("span", {class: "tm"}, hora(m.created_at)))))));

  const abierta = p.estado === "abierta", lleno = D.inscritos.length >= max + (p.max_reservas ?? 0);
  $("actions").hidden = !abierta;
  main.className = "wrap" + (abierta ? "" : " noBar");
  $("bJoin").disabled = lleno;
  $("bJoin").textContent = lleno ? "Lista y reservas completas" : lista.length >= max ? "Apuntarme a reservas" : "Apuntarme";
}

/* ---------- apuntarse / borrarse ---------- */
const sheet = $("sJoin");
sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest("[data-close]")) sheet.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") sheet.hidden = true; });
$("bJoin").onclick = () => {
  $("fName").value = ""; $("fErr").textContent = "";   // siempre vacío: cada uno escribe su nombre
  $("joinHint").textContent = D.inscritos.length >= POOL.max_jugadores
    ? "La lista está completa: entrarás en reservas y pasarás a la lista por orden si alguien se borra."
    : "Escribe tu nombre como te conocen en el grupo.";
  sheet.hidden = false; setTimeout(() => $("fName").focus(), 60);
};
$("fName").onkeydown = e => { if (e.key === "Enter") $("fSend").click(); };
$("fSend").onclick = async () => {
  const nombre = $("fName").value.replace(/\s+/g, " ").trim();
  if (!nombre) { $("fErr").textContent = "Escribe tu nombre."; return; }
  $("fSend").disabled = true; $("fSend").textContent = "Apuntando…"; $("fErr").textContent = "";
  try {
    const r = await api.apuntarse(POOL, nombre);
    const m = mias(); m[r.id] = r.token; store.set("mias", m);
    await cargar();
    const pos = D.inscritos.findIndex(i => i.id === r.id);
    sheet.hidden = true;
    toast(pos >= POOL.max_jugadores ? `Estás en reservas (R${pos - POOL.max_jugadores + 1})` : `¡Hecho! Estás el ${pos + 1}.º de la lista`);
  } catch(e) { $("fErr").textContent = errText(e); }
  $("fSend").disabled = false; $("fSend").textContent = "Apuntarme";
};
function confirmar(texto, si){
  return new Promise(res => {
    const s = h("div", {class: "sheet"}, h("div", {class: "panel", role: "dialog"}, h("h3", {}, "¿Seguro?"), h("p", {}, texto),
      h("div", {class: "stack"},
        h("button", {class: "btn primary", type: "button", onclick: () => { s.remove(); res(true); }}, si),
        h("button", {class: "btn", type: "button", onclick: () => { s.remove(); res(false); }}, "Cancelar"))));
    document.body.append(s);
  });
}
async function quitar(i){
  if (!await confirmar(`¿Borrar a ${i.nombre} de la pool?`, "Sí, borrarme")) return;
  try {
    const ok = await api.borrarse(i.id, mias()[i.id]);
    const m = mias(); delete m[i.id]; store.set("mias", m);
    toast(ok ? "Te has borrado de la pool" : "Esa inscripción ya no estaba"); await cargar();
  } catch(e) { toast(errText(e)); }
}

/* ---------- arranque ---------- */
let api = null;
try { localStorage.removeItem("pool.yo"); } catch(e) {}
async function cargar(){ D = await api.datos(POOL); vistaPool(); }
async function start(){
  if (!DEMO && !window.supabase) { $("title").textContent = "No se ha podido cargar"; $("main").replaceChildren(h("div", {class: "note warn"}, errText("red"))); return; }
  api = DEMO ? demoBackend() : supabaseBackend();
  try {
    if (!CODIGO) {
      await vistaListado();
      let t = null;
      const refrescar = () => { clearTimeout(t); t = setTimeout(() => vistaListado().catch(() => {}), 300); };
      api.escucharListado(refrescar);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(); });
      return;
    }
    POOL = await api.pool(CODIGO);
    if (!POOL) {
      $("back").hidden = false; $("title").textContent = "Pool no encontrada";
      $("main").replaceChildren(h("div", {class: "note"}, "Este enlace ya no es válido. ", h("a", {href: DEMO ? "./?demo" : "./"}, "Ver todas las pools")));
      return;
    }
    await cargar();
    let t = null;
    const refrescar = async () => {
      const p = await api.pool(POOL.codigo);
      if (!p) { vistaBorrada(); return; }
      POOL = p; await cargar();
    };
    api.escuchar(POOL, () => { clearTimeout(t); t = setTimeout(() => refrescar().catch(() => {}), 250); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar().catch(() => {}); });
  } catch(e) {
    $("title").textContent = "No se ha podido cargar";
    $("main").replaceChildren(h("div", {class: "note warn"}, errText(e)));
  }
}
start();
</script>
